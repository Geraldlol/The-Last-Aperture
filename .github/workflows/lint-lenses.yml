name: lint-lenses
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - if: matrix.node == '24'
        run: npm run lint
      - if: matrix.node == '24'
        run: npm run gen -- --check
      - if: matrix.node == '24'
        run: npm run gen:benchmarks -- --check

  transparency-https-conformance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Run stateful HTTPS transparency-log conformance
        run: npm run test:transparency:https

  provider-docker-conformance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Build digest-pinned hostile conformance peer
        run: >-
          docker build --pull=true
          --file providers/reference-byte-consumer/Dockerfile.conformance
          --build-arg
          NODE_IMAGE=node:22-bookworm@sha256:c601a46abb4d2ab80a9dc3da208d50d1122642d53f17a101926ace71e5a9bf1c
          --tag red-team-audit-reference-byte-consumer:conformance
          providers/reference-byte-consumer
      - name: Resolve immutable runtime and image identities
        id: docker
        shell: bash
        run: |
          echo "runtime=$(realpath "$(command -v docker)")" >> "$GITHUB_OUTPUT"
          echo "image=$(docker image inspect --format '{{.Id}}' red-team-audit-reference-byte-consumer:conformance)" >> "$GITHUB_OUTPUT"
      - name: Run real-Docker containment, broker, and cleanup gate
        env:
          RTA_DOCKER_RUNTIME: ${{ steps.docker.outputs.runtime }}
          RTA_PROVIDER_IMAGE: ${{ steps.docker.outputs.image }}
        run: npm run test:provider:docker

  database-docker-conformance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Pull exact disposable database engines
        run: |
          docker pull postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
          docker pull mysql@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
      - name: Resolve immutable local Docker runtime
        id: database-docker
        shell: bash
        run: echo "runtime=$(realpath "$(command -v docker)")" >> "$GITHUB_OUTPUT"
      - name: Run disposable multi-engine database conformance gate
        env:
          RTA_DOCKER_RUNTIME: ${{ steps.database-docker.outputs.runtime }}
        run: npm run test:database:docker
